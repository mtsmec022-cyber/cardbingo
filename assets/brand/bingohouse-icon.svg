  <circle cx="512" cy="560" r="220" fill="url(#ball)" stroke="#f59e0b" stroke-width="26"/>
  <path d="M348 560h328M512 396v328M396 424c-44 84-44 188 0 272M628 424c44 84 44 188 0 272" fill="none" stroke="#0f172a" stroke-width="28" stroke-linecap="round" opacity="0.9"/>
